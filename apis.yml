description: Gogs is a painless self‑hosted Git service that lets you run your own Git server with a simple, lightweight web UI. It supports repository
  creation, issue tracking, pull requests, webhooks, and integrates with LDAP and OAuth providers. Gogs is written in Go, easy to install on Linux,
  macOS, and Windows, and is suitable for teams that need a fast, low‑maintenance version‑control platform they can host themselves.

